# Starts the web UI, the API and its indexing worker, with PostgreSQL, Qdrant
# and Redis (the job queue).
#   cp .env.example .env   # then fill in the secrets
#   docker compose up --build
# Open http://localhost:3000. The API also listens on http://localhost:8000
# (Swagger UI at /docs).
#
# Monitoring (Prometheus, Grafana, Jaeger) is an optional profile:
#   docker compose --profile observability up --build
# Grafana: http://localhost:3001 (admin / GRAFANA_ADMIN_PASSWORD, default
# "admin"). Prometheus: http://localhost:9090. Traces in Jaeger at
# http://localhost:16686 once .env has OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ragforge
      POSTGRES_DB: ragforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant-data:/qdrant/storage

  # Job queue for document indexing. Append-only persistence keeps queued jobs
  # across a Redis restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: &backend-build
      context: .
      args:
        # Extras built into the image: the evaluators Ragas and DeepEval by
        # default. EVALUATOR_EXTRAS= (empty) builds a slimmer image without them.
        EXTRAS: ${EVALUATOR_EXTRAS-ragas,deepeval}
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://ragforge:${POSTGRES_PASSWORD}@postgres:5432/ragforge
      VECTOR_STORE_URL: http://qdrant:6333
      TASK_QUEUE: celery
      REDIS_URL: redis://redis:6379/0
      # Rate limits shared by every api container (docker compose up --scale api=N).
      RATE_LIMIT_BACKEND: redis
      # Prometheus metrics on the internal network only (see docker/prometheus).
      METRICS_PORT: "9464"
      # The web container (fixed address below) relays the client address for
      # signed-out requests. If you set TRUSTED_PROXIES in .env, include it.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${RAGFORGE_WEB_IP:-172.30.231.10}}
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Indexes uploaded documents (chunking and embedding) off the API process.
  # Starts after the api, which has applied the migrations by then. Run more
  # copies with `docker compose up --scale worker=3`.
  worker:
    build: *backend-build
    env_file: .env
    environment: *backend-env
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    volumes:
      - model-cache:/data/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      retries: 5

  # Rate limits: signed-in requests count per user. Signed-out ones (login,
  # register) count per client address, which the api takes from the
  # X-Forwarded-For the web container passes on, because web is listed in
  # TRUSTED_PROXIES above. Next.js passes on a header the browser sent itself,
  # so that address is not proof of anything; logins are also limited per
  # account (LOGIN_ATTEMPTS_PER_MINUTE), which a forged header cannot get
  # around. With a reverse proxy (nginx, a load balancer) in front of web that
  # sets X-Forwarded-For, list it in TRUSTED_PROXIES as well.
  web:
    build: ./frontend
    networks:
      default:
        ipv4_address: ${RAGFORGE_WEB_IP:-172.30.231.10}
    environment:
      # The UI proxies /backend/* to this address from the server side, so the
      # browser never needs to reach the API directly.
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- observability profile -------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ragforge.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # Receives traces over OTLP when .env sets OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"

networks:
  default:
    ipam:
      config:
        # Fixed so the web container has a known address to trust. Change both
        # RAGFORGE_SUBNET and RAGFORGE_WEB_IP if this range is taken on your host.
        - subnet: ${RAGFORGE_SUBNET:-172.30.231.0/24}

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  model-cache:
  prometheus-data:
  grafana-data:
