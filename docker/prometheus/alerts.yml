# Alert rules for ragleitus, loaded by prometheus.yml. Firing alerts go to
# Alertmanager (docker/alertmanager/alertmanager.yml decides who hears about
# them) and show on the Grafana dashboard. Every rule only uses metrics that
# app/core/metrics.py defines (tests/test_monitoring_config.py checks).
groups:
  - name: ragleitus
    rules:
      - alert: RagleitusApiDown
        # No api target answering, including when none is running at all.
        expr: (sum(up{job="ragleitus-api"}) or vector(0)) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The ragleitus API is down
          description: Prometheus has not been able to scrape any api container for 2 minutes.

      - alert: RagleitusWorkerDown
        expr: (sum(up{job="ragleitus-worker"}) or vector(0)) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No ragleitus worker is running
          description: >-
            Prometheus has not been able to scrape any worker for 2 minutes.
            Uploaded documents and experiments wait until a worker is back.

      - alert: RagleitusHighErrorRate
        # 5xx responses as a share of all requests, once there is some traffic.
        expr: |
          sum(rate(ragleitus_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(ragleitus_http_requests_total[5m])) > 0.05
          and sum(rate(ragleitus_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests fail
          description: '{{ $value | humanizePercentage }} of requests answered with a 5xx error over the last 5 minutes.'

      - alert: RagleitusSlowRequests
        # Routes that wait on an LLM (answers without streaming, evaluations,
        # key and settings checks) are left out: their time is the provider's.
        expr: |
          histogram_quantile(0.95, sum by (le, route) (rate(ragleitus_http_request_duration_seconds_bucket{
            route!~"/api/conversations/.*/messages|/api/evaluations.*|/api/provider-keys/.*/validate|/api/settings/.*"
          }[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Slow API route: {{ $labels.route }}'
          description: 'The 95th percentile of {{ $labels.route }} has been {{ $value | humanizeDuration }} for 10 minutes.'

      - alert: RagleitusLlmErrors
        expr: |
          sum by (provider) (rate(ragleitus_llm_calls_total{status="error"}[10m]))
            / sum by (provider) (rate(ragleitus_llm_calls_total[10m])) > 0.2
          and sum by (provider) (rate(ragleitus_llm_calls_total[10m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Calls to {{ $labels.provider }} keep failing'
          description: >-
            {{ $value | humanizePercentage }} of calls to {{ $labels.provider }} failed over the last 10 minutes
            (bad keys, rate limits or an outage; the Telemetry page shows the errors).

      - alert: RagleitusIndexingFailures
        expr: sum(increase(ragleitus_indexing_total{outcome="failed"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Documents failed to index
          description: '{{ $value | humanize }} documents failed to index in the last 15 minutes; their errors are on the Documents page.'

      - alert: RagleitusIndexingStalled
        # Documents are waiting, and none has finished indexing for 15 minutes.
        expr: |
          max(ragleitus_documents_queued{status=~"pending|indexing"}) > 0
          and (sum(increase(ragleitus_indexing_total[15m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Indexing is not making progress
          description: >-
            {{ $value }} documents are waiting to be indexed and none has finished in 15 minutes.
            Check that a worker is running and can reach Redis.
