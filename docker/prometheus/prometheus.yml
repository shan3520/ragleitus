# Scrapes ragleitus's metrics port (METRICS_PORT, 9464 in docker-compose.yml)
# on the internal network. DNS discovery finds every worker when scaled
# with `docker compose up --scale worker=3`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ragleitus-api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 9464
  - job_name: ragleitus-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9464
