[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragleitus"
version = "0.1.0"
description = "AI engineering workspace for Retrieval-Augmented Generation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "pymupdf>=1.24",
    "cryptography>=42",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "qdrant-client>=1.19,<1.20",  # keep in step with the Qdrant server pinned in docker-compose.yml
    "fastembed>=0.3",
    "anthropic>=1.9",
    "celery[redis]>=5.4,<6",
    "langgraph>=1.0,<2",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
# Optional evaluators (see app/services/evaluators); the Docker image installs both.
ragas = ["ragas>=0.4,<0.5"]
deepeval = ["deepeval>=4,<5"]
dev = [
    "pytest>=8",
    "fakeredis[lua]>=2.20",
    "ragas>=0.4,<0.5",
    "deepeval>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests (tests/live) call real providers with real keys: only with `-m live`.
addopts = "-p no:cacheprovider -m 'not live'"
markers = ["live: calls real LLM providers; needs their API keys (pytest -m live tests/live)"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
    # Notices from the optional evaluator libraries about their own changes.
    "ignore:'HallucinationMetric' now scores:DeprecationWarning",
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]
